            </button>
            <button class="nav-item" data-module="monthly">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                    <line x1="16" y1="2" x2="16" y2="6"></line>
                    <line x1="8" y1="2" x2="8" y2="6"></line>
                    <line x1="3" y1="10" x2="21" y2="10"></line>
                    <path d="M8 14h.01"></path>
                    <path d="M12 14h.01"></path>
                    <path d="M16 14h.01"></path>
                    <path d="M8 18h.01"></path>
                    <path d="M12 18h.01"></path>
                    <path d="M16 18h.01"></path>
                </svg>
                <span class="nav-label">月度</span>
            </button>
        </nav>
    </div>
    <script>
        // 标语库
        const slogans = [
            '"一万年太久，只争朝夕"',
            '"业精于勤，荒于嬉"',
            '"逝者如斯夫，不舍昼夜"',
            '"少壮不努力，老大徒伤悲"',
            '"黑发不知勤学早，白首方悔读书迟"',
            '"盛年不重来，一日难再晨"',
            '"及时当勉励，岁月不待人"',
            '"莫等闲，白了少年头，空悲切"',
            '"天行健，君子以自强不息"',
            '"路漫漫其修远兮，吾将上下而求索"',
            '"宝剑锋从磨砺出，梅花香自苦寒来"',
            '"千磨万击还坚劲，任尔东西南北风"',
            '"不积跬步，无以至千里"',
            '"锲而不舍，金石可镂"',
            '"精诚所至，金石为开"',
            '"千里之行，始于足下"',
            '"学而不思则罔，思而不学则殆"',
            '"温故而知新，可以为师矣"',
            '"知之者不如好之者，好之者不如乐之者"',
            '"三人行，必有我师焉"',
            '"生于忧患，死于安乐"',
            '"天将降大任于斯人也"',
            '"不以规矩，不能成方圆"',
            '"穷则独善其身，达则兼济天下"',
            '"吾日三省吾身"',
            '"士不可以不弘毅，任重而道远"',
            '"志不强者智不达',
            '"博学之，审问之，慎思之，明辨之，笃行之"',
            '"书山有路勤为径，学海无涯苦作舟"',
            '"长风破浪会有时，直挂云帆济沧海"'
        ];

        let lastSloganIndex = -1;
        let sloganTimeout = null;

        function updateSlogan() {
            let newIndex;
            do {
                newIndex = Math.floor(Math.random() * slogans.length);
            } while (newIndex === lastSloganIndex && slogans.length > 1);
            lastSloganIndex = newIndex;

            const sloganElement = document.getElementById('slogan-text');

            // 淡出
            sloganElement.classList.add('fade-out');
            sloganElement.classList.remove('fade-in');

            // 清除之前的定时器
            if (sloganTimeout) {
                clearTimeout(sloganTimeout);
            }

            // 500ms后更新文字并淡入
            sloganTimeout = setTimeout(() => {
                sloganElement.textContent = slogans[newIndex];
                sloganElement.classList.remove('fade-out');
                sloganElement.classList.add('fade-in');
            }, 500);
        }

        // 时分选择器状态
        let currentTimePickerType = null;
        let currentTimePickerField = null;
        let selectedHour = null;
        let selectedMinute = null;

        function openTimePicker(type, field) {
            currentTimePickerType = type;
            currentTimePickerField = field;

            const title = field === 'hour' ? '选择小时' : '选择分钟';
            document.getElementById('time-picker-title').textContent = title;

            const scrollContainer = document.getElementById('time-scroll');
            const count = field === 'hour' ? 24 : 60;

            // 生成选项
            scrollContainer.innerHTML = '';
            for (let i = 0; i < count; i++) {
                const item = document.createElement('div');
                item.className = 'time-scroll-item';
                item.textContent = String(i).padStart(2, '0');
                item.onclick = () => selectTimeItem(i, item);
                scrollContainer.appendChild(item);
            }

            // 显示弹窗
            document.getElementById('time-picker-modal').classList.add('active');

            // 滚动到当前选中值
            const currentDisplay = document.getElementById(`${type}-${field}-display`);
            const currentValue = currentDisplay.textContent;
            if (currentValue !== '时' && currentValue !== '分') {
                const value = parseInt(currentValue);
                const targetItem = scrollContainer.children[value];
                if (targetItem) {
                    targetItem.classList.add('selected');
                    targetItem.scrollIntoView({ block: 'center' });
                }
            }
        }

        function selectTimeItem(value, element) {
            document.querySelectorAll('#time-scroll .time-scroll-item').forEach(item => {
                item.classList.remove('selected');
            });
            element.classList.add('selected');

            if (currentTimePickerField === 'hour') {
                selectedHour = value;
            } else {
                selectedMinute = value;
            }
        }

        function confirmTimePicker() {
            const type = currentTimePickerType;
            const field = currentTimePickerField;

            if (field === 'hour' && selectedHour !== null) {
                document.getElementById(`${type}-hour-display`).textContent = String(selectedHour).padStart(2, '0');
                // 如果分钟没选，默认为00
                if (document.getElementById(`${type}-minute-display`).textContent === '分') {
                    document.getElementById(`${type}-minute-display`).textContent = '00';
                }
            } else if (field === 'minute' && selectedMinute !== null) {
                document.getElementById(`${type}-minute-display`).textContent = String(selectedMinute).padStart(2, '0');
            }

            document.getElementById('time-picker-modal').classList.remove('active');
            selectedHour = null;
            selectedMinute = null;
        }

        // 日历选择器
        let calendarPickerDate = new Date();

        function openCalendarPicker() {
            calendarPickerDate = new Date(datePicker.getSelectedDate());
            renderCalendarPicker();
            document.getElementById('calendar-picker-modal').classList.add('active');
        }

        function closeCalendarPicker() {
            document.getElementById('calendar-picker-modal').classList.remove('active');
        }

        function renderCalendarPicker() {
            const year = calendarPickerDate.getFullYear();
            const month = calendarPickerDate.getMonth();

            document.getElementById('calendar-picker-month').textContent = `${year}年${month + 1}月`;

            const firstDay = new Date(year, month, 1);
            let startDay = firstDay.getDay();
            if (startDay === 0) startDay = 7;

            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const today = new Date();
            const selectedDate = datePicker.getSelectedDate();

            const grid = document.getElementById('calendar-picker-grid');
            let html = '';

            // 星期头部
            const weekdays = ['一', '二', '三', '四', '五', '六', '日'];
            weekdays.forEach(day => {
                html += `<div class="calendar-picker-weekday">${day}</div>`;
            });

            // 填充空白
            for (let i = 1; i < startDay; i++) {
                html += '<div class="calendar-picker-day empty"></div>';
            }

            // 填充日期
            for (let day = 1; day <= daysInMonth; day++) {
                const date = new Date(year, month, day);
                const isToday = date.toDateString() === today.toDateString();
                const isSelected = date.toDateString() === selectedDate.toDateString();
                const className = `calendar-picker-day ${isToday ? 'today' : ''} ${isSelected ? 'selected' : ''}`;
                html += `<div class="${className}" onclick="selectCalendarDate(${year}, ${month}, ${day})">${day}</div>`;
            }

            grid.innerHTML = html;
        }

        function selectCalendarDate(year, month, day) {
            const date = new Date(year, month, day);
            datePicker.selectDate(date.toISOString());
            closeCalendarPicker();
        }

        // 日期选择器
        class DatePicker {
            constructor() {
                this.selectedDate = new Date();
                this.scrollContainer = document.getElementById('date-scroll');
                this.init();
            }

            init() {
                this.renderDates();
                this.scrollToSelected();
            }

            renderDates() {
                const today = new Date();
                const dates = [];

                for (let i = -30; i <= 30; i++) {
                    const date = new Date(today);
                    date.setDate(today.getDate() + i);
                    dates.push(date);
                }

                this.scrollContainer.innerHTML = dates.map(date => {
                    const isActive = this.isSameDay(date, this.selectedDate);
                    const weekday = this.getWeekday(date.getDay());
                    const day = String(date.getDate()).padStart(2, '0');
                    const month = String(date.getMonth() + 1).padStart(2, '0');

                    return `
                        <div class="date-item ${isActive ? 'active' : ''}"
                             data-date="${date.toISOString()}"
                             onclick="datePicker.selectDate('${date.toISOString()}')">
                            <span class="date-weekday">${weekday}</span>
                            <span class="date-day">${month}.${day}</span>
                        </div>
                    `;
                }).join('');
            }

            selectDate(dateString) {
                this.selectedDate = new Date(dateString);
                this.renderDates();
                this.scrollToSelected();
                if (typeof todoList !== 'undefined') {
                    todoList.render();
                }
            }

            scrollToSelected() {
                const activeItem = this.scrollContainer.querySelector('.date-item.active');
                if (activeItem) {
                    activeItem.scrollIntoView({
                        behavior: 'smooth',
                        block: 'nearest',
                        inline: 'center'
                    });
                }
            }

            getWeekday(day) {
                const weekdays = ['日', '一', '二', '三', '四', '五', '六'];
                return weekdays[day];
            }

            isSameDay(date1, date2) {
                return date1.getFullYear() === date2.getFullYear() &&
                       date1.getMonth() === date2.getMonth() &&
                       date1.getDate() === date2.getDate();
            }

            getSelectedDate() {
                return this.selectedDate;
            }
        }

        // 模态框管理
        class Modal {
            constructor(elementId) {
                this.element = document.getElementById(elementId);
            }

            open() {
                this.element.classList.add('active');
            }

            close() {
                this.element.classList.remove('active');
            }
        }

        // 待办管理
        class TodoList {
            constructor() {
                this.todos = this.loadTodos();
                this.currentEditId = null;
                this.currentCompleteId = null;
                this.currentDeleteId = null;
                this.init();
            }

            init() {
                this.render();
                this.bindEvents();
            }

            loadTodos() {
                const data = localStorage.getItem('reflecto_todos');
                return data ? JSON.parse(data) : [];
            }

            saveTodos() {
                localStorage.setItem('reflecto_todos', JSON.stringify(this.todos));
            }

            getTodosForDate(date) {
                const dateString = this.formatDate(date);
                return this.todos.filter(todo => todo.date === dateString);
            }

            formatDate(date) {
                const year = date.getFullYear();
                const month = String(date.getMonth() + 1).padStart(2, '0');
                const day = String(date.getDate()).padStart(2, '0');
                return `${year}-${month}-${day}`;
            }

            addTodo(title, deadlineHour, deadlineMinute, reminderHour, reminderMinute) {
                const selectedDate = datePicker.getSelectedDate();
                const newTodo = {
                    id: Date.now().toString(),
                    date: this.formatDate(selectedDate),
                    title: title,
                    deadlineHour: deadlineHour,
                    deadlineMinute: deadlineMinute,
                    reminderHour: reminderHour,
                    reminderMinute: reminderMinute,
                    completed: false,
                    duration: null,
                    skipDuration: false,
                    createdAt: new Date().toISOString()
                };

                this.todos.push(newTodo);
                this.saveTodos();
                this.render();
            }

            editTodo(id, title, deadlineHour, deadlineMinute, reminderHour, reminderMinute) {
                const todo = this.todos.find(t => t.id === id);
                if (todo) {
                    todo.title = title;
                    todo.deadlineHour = deadlineHour;
                    todo.deadlineMinute = deadlineMinute;
                    todo.reminderHour = reminderHour;
                    todo.reminderMinute = reminderMinute;
                    this.saveTodos();
                    this.render();
                }
            }

            deleteTodo(id) {
                this.todos = this.todos.filter(t => t.id !== id);
                this.saveTodos();
                this.render();
            }

            completeTodo(id, duration, skipDuration) {
                const todo = this.todos.find(t => t.id === id);
                if (todo) {
                    todo.completed = true;
                    todo.duration = duration;
                    todo.skipDuration = skipDuration;
                    this.saveTodos();
                    this.render();
                }
            }

            uncompleteTodo(id) {
                const todo = this.todos.find(t => t.id === id);
                if (todo) {
                    todo.completed = false;
                    todo.duration = null;
                    todo.skipDuration = false;
                    this.saveTodos();
                    this.render();
                }
            }

            render() {
                const selectedDate = datePicker.getSelectedDate();
                const todos = this.getTodosForDate(selectedDate);
                const todoList = document.getElementById('todo-list');

                // 排序：未完成在前（按截止时间从近到远），已完成在后（按截止时间从近到远）
                const sortedTodos = [...todos].sort((a, b) => {
                    // 先按完成状态分组
                    if (a.completed !== b.completed) {
                        return a.completed ? 1 : -1;
                    }

                    // 同组内按截止时间排序
                    const aHasDeadline = a.deadlineHour !== null;
                    const bHasDeadline = b.deadlineHour !== null;

                    if (aHasDeadline && bHasDeadline) {
                        const aTime = a.deadlineHour * 60 + a.deadlineMinute;
                        const bTime = b.deadlineHour * 60 + b.deadlineMinute;
                        return aTime - bTime;
                    }

                    if (aHasDeadline) return -1;
                    if (bHasDeadline) return 1;

                    // 都没有截止时间，按创建时间排序
                    return new Date(a.createdAt) - new Date(b.createdAt);
                });

                todoList.innerHTML = sortedTodos.map(todo => {
                    const hasDeadline = todo.deadlineHour !== null;
                    const deadlineStr = hasDeadline ? `截止 ${String(todo.deadlineHour).padStart(2, '0')}:${String(todo.deadlineMinute).padStart(2, '0')}` : '';
                    const hasDuration = todo.completed && todo.duration !== null && !todo.skipDuration;
                    const durationStr = hasDuration ? `耗时 ${todo.duration}min` : '';

                    return `
                        <div class="todo-item ${todo.completed ? 'completed' : ''}" data-id="${todo.id}">
                            <div class="todo-checkbox ${todo.completed ? 'checked' : ''}"
                                 onclick="todoList.toggleComplete('${todo.id}')"></div>
                            <div class="todo-content">
                                <div class="todo-title">${todo.title}</div>
                                <div class="todo-meta">
                                    ${hasDeadline ? `<span class="deadline">${deadlineStr}</span>` : ''}
                                    ${hasDeadline && hasDuration ? '<span class="separator">·</span>' : ''}
                                    ${hasDuration ? `<span class="duration">${durationStr}</span>` : ''}
                                </div>
                            </div>
                            <div class="todo-actions">
                                <div class="todo-action edit" onclick="todoList.openEditModal('${todo.id}')">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                                        <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
                                    </svg>
                                </div>
                                <div class="todo-action delete" onclick="todoList.openDeleteModal('${todo.id}')">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <polyline points="3 6 5 6 21 6"></polyline>
                                        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                                    </svg>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');

                this.updateProgress(todos);
                this.updatePieChart(todos);
            }

            toggleComplete(id) {
                const todo = this.todos.find(t => t.id === id);
                if (todo) {
                    if (!todo.completed) {
                        this.currentCompleteId = id;
                        document.getElementById('complete-event-name').textContent = todo.title;
                        // 重置选择状态
                        document.querySelectorAll('.duration-btn').forEach(b => b.classList.remove('selected'));
                        document.getElementById('custom-duration-input').style.display = 'none';
                        document.getElementById('custom-duration').value = '';
                        completeModal.open();
                    } else {
                        // 取消完成
                        this.uncompleteTodo(id);
                    }
                }
            }

            openEditModal(id) {
                const todo = this.todos.find(t => t.id === id);
                if (todo) {
                    this.currentEditId = id;
                    document.getElementById('modal-title').textContent = '编辑待办';
                    document.getElementById('todo-input').value = todo.title;
                    document.getElementById('todo-submit-btn').textContent = '保存';

                    // 设置时间显示
                    document.getElementById('deadline-hour-display').textContent = todo.deadlineHour !== null ? String(todo.deadlineHour).padStart(2, '0') : '时';
                    document.getElementById('deadline-minute-display').textContent = todo.deadlineMinute !== null ? String(todo.deadlineMinute).padStart(2, '0') : '分';
                    document.getElementById('reminder-hour-display').textContent = todo.reminderHour !== null ? String(todo.reminderHour).padStart(2, '0') : '时';
                    document.getElementById('reminder-minute-display').textContent = todo.reminderMinute !== null ? String(todo.reminderMinute).padStart(2, '0') : '分';

                    todoModal.open();
                }
            }

            openDeleteModal(id) {
                this.currentDeleteId = id;
                deleteModal.open();
            }

            updateProgress(todos) {
                const total = todos.length;
                const completed = todos.filter(t => t.completed).length;
                const percent = total > 0 ? Math.round((completed / total) * 100) : 0;

                document.getElementById('progress-percent').textContent = `${percent}%`;
                document.getElementById('progress-fill').style.width = `${percent}%`;
            }

            updatePieChart(todos) {
                const canvas = document.getElementById('pie-chart');
                const ctx = canvas.getContext('2d');
                const legend = document.getElementById('chart-legend');

                // 只统计已完成且有耗时且未跳过耗时的事件
                const completedWithDuration = todos.filter(t => t.completed && t.duration !== null && !t.skipDuration);

                if (completedWithDuration.length === 0) {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    legend.innerHTML = '<div class="legend-item" style="color: var(--color-text-muted);">暂无数据</div>';
                    return;
                }

                const totalDuration = completedWithDuration.reduce((sum, t) => sum + t.duration, 0);

                const colors = [
                    '#4a7c59', '#7ab68a', '#a8d5b8', '#2d5a2d',
                    '#6b9b7a', '#8fc49e', '#b5dcc0', '#3d6b4a'
                ];

                // 动画绘制饼状图
                let progress = 0;
                const animationDuration = 1000;
                const startTime = performance.now();

                function animate(currentTime) {
                    progress = Math.min((currentTime - startTime) / animationDuration, 1);

                    ctx.clearRect(0, 0, canvas.width, canvas.height);

                    const centerX = canvas.width / 2;
                    const centerY = canvas.height / 2;
                    const radius = 65;

                    let startAngle = -Math.PI / 2;
                    const totalAngle = progress * 2 * Math.PI;

                    // 绘制阴影
                    ctx.save();
                    ctx.shadowColor = 'rgba(0, 0, 0, 0.15)';
                    ctx.shadowBlur = 15;
                    ctx.shadowOffsetX = 0;
                    ctx.shadowOffsetY = 5;
                    ctx.beginPath();
                    ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
                    ctx.fillStyle = 'white';
                    ctx.fill();
                    ctx.restore();

                    // 绘制实心饼状图
                    completedWithDuration.forEach((todo, index) => {
                        const sliceAngle = (todo.duration / totalDuration) * totalAngle;
                        const color = colors[index % colors.length];

                        ctx.beginPath();
                        ctx.moveTo(centerX, centerY);
                        ctx.arc(centerX, centerY, radius, startAngle, startAngle + sliceAngle);
                        ctx.closePath();
                        ctx.fillStyle = color;
                        ctx.fill();

                        // 添加分隔线
                        ctx.strokeStyle = 'white';
                        ctx.lineWidth = 3;
                        ctx.stroke();

                        startAngle += sliceAngle;
                    });

                    if (progress < 1) {
                        requestAnimationFrame(animate);
                    }
                }

                requestAnimationFrame(animate);

                // 更新图例
                legend.innerHTML = completedWithDuration.map((todo, index) => {
                    const color = colors[index % colors.length];
                    const percent = Math.round((todo.duration / totalDuration) * 100);
                    return `
                        <div class="legend-item">
                            <div class="legend-dot" style="background-color: ${color}"></div>
                            <span>${todo.title} ${todo.duration}min (${percent}%)</span>
                        </div>
                    `;
                }).join('');
            }

            bindEvents() {
                document.getElementById('add-todo-btn').addEventListener('click', () => {
                    this.currentEditId = null;
                    document.getElementById('modal-title').textContent = '添加待办';
                    document.getElementById('todo-submit-btn').textContent = '添加';
                    document.getElementById('todo-input').value = '';
                    document.getElementById('deadline-hour-display').textContent = '时';
                    document.getElementById('deadline-minute-display').textContent = '分';
                    document.getElementById('reminder-hour-display').textContent = '时';
                    document.getElementById('reminder-minute-display').textContent = '分';
                    todoModal.open();
                });

                document.getElementById('todo-submit-btn').addEventListener('click', () => {
                    const title = document.getElementById('todo-input').value.trim();
                    if (!title) {
                        alert('请输入事件描述');
                        return;
                    }

                    const deadlineHourText = document.getElementById('deadline-hour-display').textContent;
                    const deadlineMinuteText = document.getElementById('deadline-minute-display').textContent;
                    const reminderHourText = document.getElementById('reminder-hour-display').textContent;
                    const reminderMinuteText = document.getElementById('reminder-minute-display').textContent;

                    const deadlineHour = deadlineHourText !== '时' ? parseInt(deadlineHourText) : null;
                    let deadlineMinute = deadlineMinuteText !== '分' ? parseInt(deadlineMinuteText) : null;
                    const reminderHour = reminderHourText !== '时' ? parseInt(reminderHourText) : null;
                    let reminderMinute = reminderMinuteText !== '分' ? parseInt(reminderMinuteText) : null;

                    // 如果填了小时但没填分钟，默认为00
                    if (deadlineHour !== null && deadlineMinute === null) {
                        deadlineMinute = 0;
                    }
                    if (reminderHour !== null && reminderMinute === null) {
                        reminderMinute = 0;
                    }

                    if (this.currentEditId) {
                        this.editTodo(this.currentEditId, title, deadlineHour, deadlineMinute, reminderHour, reminderMinute);
                    } else {
                        this.addTodo(title, deadlineHour, deadlineMinute, reminderHour, reminderMinute);
                    }

                    todoModal.close();
                });

                // 完成耗时选择
                document.querySelectorAll('.duration-btn').forEach(btn => {
                    btn.addEventListener('click', function() {
                        document.querySelectorAll('.duration-btn').forEach(b => b.classList.remove('selected'));
                        this.classList.add('selected');

                        if (this.classList.contains('custom-duration-btn')) {
                            document.getElementById('custom-duration-input').style.display = 'flex';
                        } else {
                            document.getElementById('custom-duration-input').style.display = 'none';
                        }
                    });
                });

                // 确认完成
                document.getElementById('complete-confirm-btn').addEventListener('click', () => {
                    const selectedBtn = document.querySelector('.duration-btn.selected');
                    let duration = null;
                    let skipDuration = false;

                    if (selectedBtn) {
                        if (selectedBtn.dataset.duration === 'skip') {
                            skipDuration = true;
                        } else if (selectedBtn.classList.contains('custom-duration-btn')) {
                            const customInput = document.getElementById('custom-duration');
                            duration = customInput.value ? parseInt(customInput.value) : null;
                        } else {
                            duration = parseInt(selectedBtn.dataset.duration);
                        }
                    }

                    if (this.currentCompleteId) {
                        this.completeTodo(this.currentCompleteId, duration, skipDuration);
                    }

                    completeModal.close();
                });

                // 删除确认
                document.getElementById('delete-confirm-btn').addEventListener('click', () => {
                    if (this.currentDeleteId) {
                        this.deleteTodo(this.currentDeleteId);
                    }
                    deleteModal.close();
                });
            }
        }

        // 恒例管理
        class RoutineList {
            constructor() {
                this.routines = this.loadRoutines();
                this.currentWeekStart = this.getWeekStart(new Date());
                this.currentDeleteId = null;
                this.init();
            }

            init() {
                this.renderWeekSelector();
                this.renderTable();
                this.renderLineChart();
                this.bindEvents();
            }

            loadRoutines() {
                const data = localStorage.getItem('reflecto_routines');
                return data ? JSON.parse(data) : [];
            }

            saveRoutines() {
                localStorage.setItem('reflecto_routines', JSON.stringify(this.routines));
            }

            getWeekStart(date) {
                const d = new Date(date);
                const day = d.getDay();
                const diff = d.getDate() - day + (day === 0 ? -6 : 1);
                d.setDate(diff);
                d.setHours(0, 0, 0, 0);
                return d;
            }

            getWeekDates(weekStart) {
                const dates = [];
                for (let i = 0; i < 7; i++) {
                    const date = new Date(weekStart);
                    date.setDate(weekStart.getDate() + i);
                    dates.push(date);
                }
                return dates;
            }

            formatDate(date) {
                const year = date.getFullYear();
                const month = String(date.getMonth() + 1).padStart(2, '0');
                const day = String(date.getDate()).padStart(2, '0');
                return `${year}-${month}-${day}`;
            }

            isToday(date) {
                const today = new Date();
                return date.getFullYear() === today.getFullYear() &&
                       date.getMonth() === today.getMonth() &&
                       date.getDate() === today.getDate();
            }

            isFutureDate(date) {
                const today = new Date();
                today.setHours(0, 0, 0, 0);
                return date > today;
            }

            addRoutine(name, hour, minute) {
                const newRoutine = {
                    id: Date.now().toString(),
                    name: name,
                    hour: hour,
                    minute: minute,
                    completions: {}
                };

                this.routines.push(newRoutine);
                // 按时间排序
                this.routines.sort((a, b) => {
                    const aTime = a.hour * 60 + a.minute;
                    const bTime = b.hour * 60 + b.minute;
                    return aTime - bTime;
                });
                this.saveRoutines();
                this.renderTable();
                this.renderLineChart();
            }

            deleteRoutine(id) {
                this.routines = this.routines.filter(r => r.id !== id);
                this.saveRoutines();
                this.renderTable();
                this.renderLineChart();
            }

            toggleCompletion(routineId, dateString) {
                const routine = this.routines.find(r => r.id === routineId);
                if (routine) {
                    if (!routine.completions[dateString]) {
                        routine.completions[dateString] = true;
                    } else {
                        delete routine.completions[dateString];
                    }
                    this.saveRoutines();
                    this.renderTable();
                    this.renderLineChart();
                }
            }

            renderWeekSelector() {
                const weekEnd = new Date(this.currentWeekStart);
                weekEnd.setDate(this.currentWeekStart.getDate() + 6);

                const startMonth = String(this.currentWeekStart.getMonth() + 1).padStart(2, '0');
                const startDay = String(this.currentWeekStart.getDate()).padStart(2, '0');
                const endMonth = String(weekEnd.getMonth() + 1).padStart(2, '0');
                const endDay = String(weekEnd.getDate()).padStart(2, '0');

                document.getElementById('week-range').textContent = `${startMonth}.${startDay} ~ ${endMonth}.${endDay}`;
            }

            renderTable() {
                const dates = this.getWeekDates(this.currentWeekStart);
                const weekdays = ['一', '二', '三', '四', '五', '六', '日'];
                const today = new Date();
                today.setHours(0, 0, 0, 0);

                // 判断当前查看的周是否是本月或之后的月份
                const weekMonth = this.currentWeekStart.getMonth();
                const weekYear = this.currentWeekStart.getFullYear();
                const isCurrentOrFutureMonth = weekYear > today.getFullYear() ||
                    (weekYear === today.getFullYear() && weekMonth >= today.getMonth());

                // 渲染表头
                const tableHeader = document.getElementById('table-header');
                tableHeader.innerHTML = `
                    <div class="table-header-cell"></div>
                    ${dates.map((date, index) => `
                        <div class="table-header-cell ${this.isToday(date) ? 'today' : ''}">
                            <div class="weekday">${weekdays[index]}</div>
                            <div class="day">${String(date.getDate()).padStart(2, '0')}</div>
                        </div>
                    `).join('')}
                `;

                // 获取本周最后一天
                const weekEnd = new Date(dates[6]);
                weekEnd.setHours(23, 59, 59, 999);

                // 筛选对本周有效的恒例
                // 规则：恒例从创建日所在月份的1号开始生效
                // 如果恒例创建月份 <= 本周最后一天所在月份，则对本周有效
                const validRoutines = this.routines.filter(r => {
                    const createdDate = new Date(parseInt(r.id));
                    const createdMonth = createdDate.getMonth();
                    const createdYear = createdDate.getFullYear();
                    const weekEndMonth = weekEnd.getMonth();
                    const weekEndYear = weekEnd.getFullYear();

                    if (createdYear < weekEndYear) return true;
                    if (createdYear === weekEndYear && createdMonth <= weekEndMonth) return true;
                    return false;
                });

                // 按时间排序恒例
                const sortedRoutines = [...validRoutines].sort((a, b) => {
                    const aTime = a.hour * 60 + a.minute;
                    const bTime = b.hour * 60 + b.minute;
                    return aTime - bTime;
                });

                // 渲染表格内容
                const tableContent = document.getElementById('table-content');
                tableContent.innerHTML = sortedRoutines.map(routine => {
                    const timeStr = `${String(routine.hour).padStart(2, '0')}:${String(routine.minute).padStart(2, '0')}`;
                    const routineCreatedDate = new Date(parseInt(routine.id));
                    const routineCreatedMonth = routineCreatedDate.getMonth();
                    const routineCreatedYear = routineCreatedDate.getFullYear();

                    return `
                        <div class="table-row" data-id="${routine.id}">
                            <div class="table-cell routine-info">
                                <div class="routine-name">${routine.name}</div>
                                <div class="routine-time">${timeStr}</div>
                                <div class="routine-actions">
                                    <div class="routine-action" onclick="routineList.openDeleteModal('${routine.id}')">
                                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                            <polyline points="3 6 5 6 21 6"></polyline>
                                            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                                        </svg>
                                    </div>
                                </div>
                            </div>
                            ${dates.map(date => {
                                const dateString = this.formatDate(date);
                                const isCompleted = routine.completions[dateString] || false;
                                const isFuture = date > today;
                                const dateMonth = date.getMonth();
                                const dateYear = date.getFullYear();

                                // 判断是否可以打勾：
                                // 1. 不能是未来日期
                                // 2. 日期必须在恒例创建月份或之后
                                // 3. 日期必须在当前月份或之后（不能打勾已过去的月份）
                                let canCheck = false;
                                if (!isFuture) {
                                    const isAfterRoutineCreation = dateYear > routineCreatedYear ||
                                        (dateYear === routineCreatedYear && dateMonth >= routineCreatedMonth);
                                    const isCurrentOrFutureMonth = dateYear > today.getFullYear() ||
                                        (dateYear === today.getFullYear() && dateMonth >= today.getMonth());
                                    canCheck = isAfterRoutineCreation && isCurrentOrFutureMonth;
                                }

                                const isDisabled = !canCheck;

                                return `
                                    <div class="table-cell">
                                        <div class="routine-checkbox ${isCompleted ? 'checked' : ''} ${isDisabled ? 'disabled' : ''}"
                                             onclick="${isDisabled ? `alert('不能勾选此日期')` : `routineList.toggleCompletion('${routine.id}', '${dateString}')`}"
                                        ></div>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    `;
                }).join('');
            }

            renderLineChart() {
                const canvas = document.getElementById('line-chart');
                const ctx = canvas.getContext('2d');
                const dates = this.getWeekDates(this.currentWeekStart);
                const weekdays = ['一', '二', '三', '四', '五', '六', '日'];
                const routinesLength = this.routines.length;

                // 设置canvas尺寸
                canvas.width = canvas.parentElement.offsetWidth;
                canvas.height = 180;

                const completionRates = dates.map(date => {
                    const dateString = this.formatDate(date);
                    const total = routinesLength;
                    if (total === 0) return 0;
                    const completed = this.routines.filter(r => r.completions[dateString]).length;
                    return Math.round((completed / total) * 100);
                });

                const padding = { top: 20, right: 30, bottom: 35, left: 45 };
                const chartWidth = canvas.width - padding.left - padding.right;
                const chartHeight = canvas.height - padding.top - padding.bottom;

                // 动画参数
                const animationDuration = 500;
                const startTime = performance.now();

                const self = this;

                function animate(currentTime) {
                    const progress = Math.min((currentTime - startTime) / animationDuration, 1);
                    const easedProgress = 1 - Math.pow(1 - progress, 3); // 缓动函数

                    ctx.clearRect(0, 0, canvas.width, canvas.height);

                    // 绘制背景网格
                    ctx.strokeStyle = '#e0ede0';
                    ctx.lineWidth = 1;

                    const yLabels = ['100%', '80%', '60%', '40%', '20%', '0%'];
                    yLabels.forEach((label, index) => {
                        const y = padding.top + (chartHeight / 5) * index;

                        ctx.beginPath();
                        ctx.moveTo(padding.left, y);
                        ctx.lineTo(canvas.width - padding.right, y);
                        ctx.stroke();

                        ctx.font = '11px "Noto Sans SC"';
                        ctx.fillStyle = '#7ab68a';
                        ctx.textAlign = 'right';
                        ctx.fillText(label, padding.left - 8, y + 4);
                    });

                    // X轴标签
                    ctx.textAlign = 'center';
                    ctx.font = '12px "Noto Sans SC"';
                    weekdays.forEach((day, index) => {
                        const x = padding.left + (chartWidth / 6) * index;
                        ctx.fillStyle = '#4a7c59';
                        ctx.fillText(day, x, canvas.height - 10);
                    });

                    if (routinesLength > 0) {
                        // 计算动画中的完成率
                        const animatedRates = completionRates.map(rate => rate * easedProgress);

                        // 绘制渐变填充
                        const gradient = ctx.createLinearGradient(0, padding.top, 0, padding.top + chartHeight);
                        gradient.addColorStop(0, 'rgba(74, 124, 89, 0.3)');
                        gradient.addColorStop(1, 'rgba(74, 124, 89, 0.02)');

                        ctx.beginPath();
                        ctx.moveTo(padding.left, padding.top + chartHeight);

                        animatedRates.forEach((rate, index) => {
                            const x = padding.left + (chartWidth / 6) * index;
                            const y = padding.top + chartHeight - (rate / 100) * chartHeight;

                            if (index === 0) {
                                ctx.lineTo(x, y);
                            } else {
                                const prevX = padding.left + (chartWidth / 6) * (index - 1);
                                const prevY = padding.top + chartHeight - (animatedRates[index - 1] / 100) * chartHeight;
                                const cpX = (prevX + x) / 2;
                                ctx.bezierCurveTo(cpX, prevY, cpX, y, x, y);
                            }
                        });

                        ctx.lineTo(canvas.width - padding.right, padding.top + chartHeight);
                        ctx.closePath();
                        ctx.fillStyle = gradient;
                        ctx.fill();

                        // 绘制折线
                        ctx.beginPath();
                        ctx.strokeStyle = '#4a7c59';
                        ctx.lineWidth = 3;
                        ctx.lineJoin = 'round';
                        ctx.lineCap = 'round';

                        animatedRates.forEach((rate, index) => {
                            const x = padding.left + (chartWidth / 6) * index;
                            const y = padding.top + chartHeight - (rate / 100) * chartHeight;

                            if (index === 0) {
                                ctx.moveTo(x, y);
                            } else {
                                const prevX = padding.left + (chartWidth / 6) * (index - 1);
                                const prevY = padding.top + chartHeight - (animatedRates[index - 1] / 100) * chartHeight;
                                const cpX = (prevX + x) / 2;
                                ctx.bezierCurveTo(cpX, prevY, cpX, y, x, y);
                            }
                        });

                        ctx.stroke();

                        // 绘制数据点
                        animatedRates.forEach((rate, index) => {
                            const x = padding.left + (chartWidth / 6) * index;
                            const y = padding.top + chartHeight - (rate / 100) * chartHeight;

                            // 外圈光晕
                            ctx.beginPath();
                            ctx.arc(x, y, 8, 0, Math.PI * 2);
                            ctx.fillStyle = 'rgba(74, 124, 89, 0.15)';
                            ctx.fill();

                            // 内圈
                            ctx.beginPath();
                            ctx.arc(x, y, 4, 0, Math.PI * 2);
                            ctx.fillStyle = '#4a7c59';
                            ctx.fill();
                            ctx.strokeStyle = 'white';
                            ctx.lineWidth = 2;
                            ctx.stroke();
                        });
                    }

                    if (progress < 1) {
                        requestAnimationFrame(animate);
                    }
                }

                requestAnimationFrame(animate);
            }

            openDeleteModal(id) {
                this.currentDeleteId = id;
                routineDeleteModal.open();
            }

            bindEvents() {
                document.getElementById('prev-week').addEventListener('click', () => {
                    this.currentWeekStart.setDate(this.currentWeekStart.getDate() - 7);
                    this.renderWeekSelector();
                    this.renderTable();
                    this.renderLineChart();
                });

                document.getElementById('next-week').addEventListener('click', () => {
                    this.currentWeekStart.setDate(this.currentWeekStart.getDate() + 7);
                    this.renderWeekSelector();
                    this.renderTable();
                    this.renderLineChart();
                });

                document.getElementById('add-routine-btn').addEventListener('click', () => {
                    document.getElementById('routine-input').value = '';
                    document.getElementById('routine-hour-display').textContent = '06';
                    document.getElementById('routine-minute-display').textContent = '00';
                    routineModal.open();
                });

                document.getElementById('routine-submit-btn').addEventListener('click', () => {
                    const name = document.getElementById('routine-input').value.trim();
                    if (!name) {
                        alert('请输入事件描述');
                        return;
                    }

                    if (name.length > 12) {
                        alert('事件描述最多12个字符');
                        return;
                    }

                    const hour = parseInt(document.getElementById('routine-hour-display').textContent);
                    const minute = parseInt(document.getElementById('routine-minute-display').textContent);

                    this.addRoutine(name, hour, minute);
                    routineModal.close();
                });

                document.getElementById('routine-delete-confirm-btn').addEventListener('click', () => {
                    if (this.currentDeleteId) {
                        this.deleteRoutine(this.currentDeleteId);
                    }
                    routineDeleteModal.close();
                });
            }
        }

        // 月度管理
        class MonthlyView {
            constructor() {
                this.currentDate = new Date();
                this.init();
            }

            init() {
                this.renderMonthTitle();
                this.renderCalendar();
                this.renderStats();
                this.bindEvents();
            }

            renderMonthTitle() {
                const year = this.currentDate.getFullYear();
                const month = this.currentDate.getMonth() + 1;
                document.getElementById('month-title').textContent = `${year}年${month}月`;
            }

            renderCalendar() {
                const year = this.currentDate.getFullYear();
                const month = this.currentDate.getMonth();

                const firstDay = new Date(year, month, 1);
                let startDay = firstDay.getDay();
                if (startDay === 0) startDay = 7;

                const daysInMonth = new Date(year, month + 1, 0).getDate();

                const calendarGrid = document.getElementById('calendar-grid');
                let html = '';

                for (let i = 1; i < startDay; i++) {
                    html += '<div class="calendar-day empty"></div>';
                }

                const today = new Date();
                for (let day = 1; day <= daysInMonth; day++) {
                    const date = new Date(year, month, day);
                    const isToday = this.isSameDay(date, today);
                    const completionLevel = this.getCompletionLevel(date);

                    let className = 'calendar-day';
                    className += ` level-${completionLevel}`;
                    if (isToday) {
                        className += ' today';
                    }

                    html += `<div class="${className}">${day}</div>`;
                }

                calendarGrid.innerHTML = html;
            }

            getCompletionLevel(date) {
                const dateString = this.formatDate(date);
                const today = new Date();
                today.setHours(0, 0, 0, 0);

                // 未来日期不计算完成度
                if (date > today) return 0;

                const dateMonth = date.getMonth();
                const dateYear = date.getFullYear();

                // 获取当日日程
                const todos = JSON.parse(localStorage.getItem('reflecto_todos') || '[]');
                const dayTodos = todos.filter(t => t.date === dateString);
                const completedTodos = dayTodos.filter(t => t.completed).length;

                // 获取当日对应的恒例（从创建日所在月份的1号开始生效）
                const routines = JSON.parse(localStorage.getItem('reflecto_routines') || '[]');
                const validRoutines = routines.filter(r => {
                    const createdDate = new Date(parseInt(r.id));
                    const createdMonth = createdDate.getMonth();
                    const createdYear = createdDate.getFullYear();
                    // 恒例从创建月份的1号开始生效
                    if (createdYear < dateYear) return true;
                    if (createdYear === dateYear && createdMonth <= dateMonth) return true;
                    return false;
                });
                const completedRoutines = validRoutines.filter(r => r.completions[dateString]).length;

                // A = 完成的日程 + 打勾的恒例
                // B = 当日日程 + 当日恒例
                const A = completedTodos + completedRoutines;
                const B = dayTodos.length + validRoutines.length;

                if (B === 0) return 0;

                const completionRate = A / B;

                if (completionRate === 0) return 0;
                if (completionRate <= 0.25) return 1;
                if (completionRate <= 0.5) return 2;
                if (completionRate <= 0.75) return 3;
                return 4;
            }

            renderStats() {
                const year = this.currentDate.getFullYear();
                const month = this.currentDate.getMonth();
                const daysInMonth = new Date(year, month + 1, 0).getDate();
                const today = new Date();
                today.setHours(0, 0, 0, 0);

                // 计算本月已历日期数（含当天）
                let daysElapsed;
                if (today.getFullYear() === year && today.getMonth() === month) {
                    daysElapsed = today.getDate();
                } else if (today.getFullYear() > year || (today.getFullYear() === year && today.getMonth() > month)) {
                    daysElapsed = daysInMonth;
                } else {
                    daysElapsed = 0;
                }

                // 获取本月日程
                const todos = JSON.parse(localStorage.getItem('reflecto_todos') || '[]');
                const monthTodos = todos.filter(t => {
                    const todoDate = new Date(t.date);
                    return todoDate.getFullYear() === year && todoDate.getMonth() === month;
                });
                const completedTodos = monthTodos.filter(t => t.completed);

                // 获取恒例
                const routines = JSON.parse(localStorage.getItem('reflecto_routines') || '[]');

                // 计算当天对应的有效恒例数（用于"每日恒例"显示）
                const todayRoutines = routines.filter(r => {
                    const createdDate = new Date(parseInt(r.id));
                    const createdMonth = createdDate.getMonth();
                    const createdYear = createdDate.getFullYear();
                    if (createdYear < year) return true;
                    if (createdYear === year && createdMonth <= month) return true;
                    return false;
                });

                // 计算本月已完成恒例数（从1号到今天）
                let totalRoutinesCompleted = 0;
                for (let day = 1; day <= daysElapsed; day++) {
                    const date = new Date(year, month, day);
                    const dateString = this.formatDate(date);

                    // 当天对应的恒例
                    const routinesForDay = routines.filter(r => {
                        const createdDate = new Date(parseInt(r.id));
                        const createdMonth = createdDate.getMonth();
                        const createdYear = createdDate.getFullYear();
                        if (createdYear < year) return true;
                        if (createdYear === year && createdMonth <= month) return true;
                        return false;
                    });

                    totalRoutinesCompleted += routinesForDay.filter(r => r.completions[dateString]).length;
                }

                // 每日平均完成恒例 = 本月已完成恒例数 / 当天日期
                const avgRoutines = daysElapsed > 0 ? (totalRoutinesCompleted / daysElapsed).toFixed(1) : 0;

                // 月完成度 = (已完成日程 + 已完成恒例) / (已添加日程 + 本月天数 × 每日恒例数)
                const A = completedTodos.length + totalRoutinesCompleted;
                const B = monthTodos.length + (daysInMonth * todayRoutines.length);
                const monthlyCompletion = B > 0 ? Math.round((A / B) * 100) : 0;

                document.getElementById('stat-todos-added').textContent = `${monthTodos.length} 条`;
                document.getElementById('stat-todos-completed').textContent = `${completedTodos.length} 条`;
                document.getElementById('stat-routines-total').textContent = `${todayRoutines.length} 条`;
                document.getElementById('stat-routines-avg').textContent = `${avgRoutines} 条`;
                document.getElementById('stat-monthly-completion').textContent = `${monthlyCompletion}%`;
            }

            formatDate(date) {
                const year = date.getFullYear();
                const month = String(date.getMonth() + 1).padStart(2, '0');
                const day = String(date.getDate()).padStart(2, '0');
                return `${year}-${month}-${day}`;
            }

            isSameDay(date1, date2) {
                return date1.getFullYear() === date2.getFullYear() &&
                       date1.getMonth() === date2.getMonth() &&
                       date1.getDate() === date2.getDate();
            }

            bindEvents() {
                document.getElementById('prev-month').addEventListener('click', () => {
                    this.currentDate.setMonth(this.currentDate.getMonth() - 1);
                    this.renderMonthTitle();
                    this.renderCalendar();
                    this.renderStats();
                });

                document.getElementById('next-month').addEventListener('click', () => {
                    this.currentDate.setMonth(this.currentDate.getMonth() + 1);
                    this.renderMonthTitle();
                    this.renderCalendar();
                    this.renderStats();
                });
            }
        }

        // 初始化
        let datePicker;
        let todoList;
        let todoModal;
        let completeModal;
        let deleteModal;
        let routineList;
        let routineModal;
        let routineDeleteModal;
        let monthlyView;

        document.addEventListener('DOMContentLoaded', function() {
            datePicker = new DatePicker();
            todoModal = new Modal('todo-modal');
            completeModal = new Modal('complete-modal');
            deleteModal = new Modal('delete-modal');
            todoList = new TodoList();
            routineModal = new Modal('routine-modal');
            routineDeleteModal = new Modal('routine-delete-modal');
            routineList = new RoutineList();
            monthlyView = new MonthlyView();

            // 绑定模态框关闭按钮事件
            document.querySelectorAll('.modal-close').forEach(btn => {
                btn.addEventListener('click', function() {
                    const modal = this.closest('.modal-overlay');
                    if (modal) {
                        modal.classList.remove('active');
                    }
                });
            });

            // 绑定模态框取消按钮事件
            document.querySelectorAll('.btn-secondary').forEach(btn => {
                btn.addEventListener('click', function() {
                    const modal = this.closest('.modal-overlay');
                    if (modal) {
                        modal.classList.remove('active');
                    }
                });
            });

            // 日历按钮事件
            document.getElementById('calendar-btn').addEventListener('click', openCalendarPicker);

            // 日历选择器导航
            document.getElementById('calendar-picker-prev').addEventListener('click', () => {
                calendarPickerDate.setMonth(calendarPickerDate.getMonth() - 1);
                renderCalendarPicker();
            });

            document.getElementById('calendar-picker-next').addEventListener('click', () => {
                calendarPickerDate.setMonth(calendarPickerDate.getMonth() + 1);
                renderCalendarPicker();
            });

            // 模块切换逻辑
            const navItems = document.querySelectorAll('.nav-item');
            const modules = document.querySelectorAll('.module');
            const addTodoBtn = document.getElementById('add-todo-btn');
            const addRoutineBtn = document.getElementById('add-routine-btn');

            navItems.forEach(item => {
                item.addEventListener('click', function() {
                    const targetModule = this.dataset.module;

                    navItems.forEach(nav => nav.classList.remove('active'));
                    this.classList.add('active');

                    modules.forEach(module => module.classList.remove('active'));
                    document.getElementById(`${targetModule}-module`).classList.add('active');

                    updateSlogan();

                    if (targetModule === 'schedule') {
                        addTodoBtn.style.display = 'flex';
                        addRoutineBtn.style.display = 'none';
                    } else if (targetModule === 'routine') {
                        addTodoBtn.style.display = 'none';
                        addRoutineBtn.style.display = 'flex';
                    } else {
                        addTodoBtn.style.display = 'none';
                        addRoutineBtn.style.display = 'none';
                    }

                    if (targetModule === 'schedule' && typeof todoList !== 'undefined') {
                        todoList.render();
                    } else if (targetModule === 'routine' && typeof routineList !== 'undefined') {
                        routineList.renderTable();
                        routineList.renderLineChart();
                    } else if (targetModule === 'monthly' && typeof monthlyView !== 'undefined') {
                        monthlyView.renderCalendar();
                        monthlyView.renderStats();
                    }
                });
            });
        });
    </script>
</body>
</html>
