<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>观己 Reflecto</title>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            /* 主色调 - 自然绿意 */
            --color-primary: #4a7c59;
            --color-primary-light: #7ab68a;
            --color-primary-lighter: #a8d5b8;
            --color-primary-bg: #f5f8f5;
            --color-card-bg: #ffffff;

            /* 文字颜色 */
            --color-text-primary: #2d5a2d;
            --color-text-secondary: #4a7c59;
            --color-text-muted: #7ab68a;
            --color-text-disabled: #c4d8c4;

            /* 功能色 */
            --color-danger: #e88a8a;
            --color-danger-bg: #fef0f0;

            /* 字体 */
            --font-serif: 'Zen Old Mincho', serif;
            --font-sans: 'Noto Sans SC', sans-serif;

            /* 圆角 */
            --radius-sm: 4px;
            --radius-md: 8px;
            --radius-lg: 12px;
            --radius-xl: 16px;
            --radius-2xl: 20px;

            /* 阴影 */
            --shadow-sm: 0 1px 4px rgba(45, 90, 45, 0.06);
            --shadow-md: 0 2px 12px rgba(45, 90, 45, 0.08);
            --shadow-lg: 0 4px 16px rgba(45, 90, 45, 0.1);

            /* 间距 */
            --space-1: 4px;
            --space-2: 8px;
            --space-3: 12px;
            --space-4: 16px;
            --space-5: 20px;
            --space-6: 24px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            font-family: var(--font-sans);
            font-size: 14px;
            color: var(--color-text-primary);
            background-color: var(--color-primary-bg);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        #app {
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        /* 滚动条样式 */
        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--color-primary-lighter);
            border-radius: 2px;
        }

        /* 按钮基础样式 */
        button {
            font-family: inherit;
            cursor: pointer;
            border: none;
            background: none;
            outline: none;
        }

        /* 输入框基础样式 */
        input, textarea, select {
            font-family: inherit;
            font-size: inherit;
            outline: none;
        }
    </style>
</head>
<body>
    <div id="app">
        <!-- 应用内容将在这里构建 -->
    </div>
    <script>
        // JavaScript 代码将在后续步骤添加
    </script>
</body>
</html>
