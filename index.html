<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>观己 Reflecto</title>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            /* 主色调 - 自然绿意 */
            --color-primary: #4a7c59;
            --color-primary-light: #7ab68a;
            --color-primary-lighter: #a8d5b8;
            --color-primary-bg: #f5f8f5;
            --color-card-bg: #ffffff;

            /* 文字颜色 */
            --color-text-primary: #2d5a2d;
            --color-text-secondary: #4a7c59;
            --color-text-muted: #7ab68a;
            --color-text-disabled: #c4d8c4;

            /* 功能色 */
            --color-danger: #e88a8a;
            --color-danger-bg: #fef0f0;

            /* 字体 */
            --font-serif: 'Zen Old Mincho', serif;
            --font-sans: 'Noto Sans SC', sans-serif;

            /* 圆角 */
            --radius-sm: 4px;
            --radius-md: 8px;
            --radius-lg: 12px;
            --radius-xl: 16px;
            --radius-2xl: 20px;

            /* 阴影 */
            --shadow-sm: 0 1px 4px rgba(45, 90, 45, 0.06);
            --shadow-md: 0 2px 12px rgba(45, 90, 45, 0.08);
            --shadow-lg: 0 4px 16px rgba(45, 90, 45, 0.1);

            /* 间距 */
            --space-1: 4px;
            --space-2: 8px;
            --space-3: 12px;
            --space-4: 16px;
            --space-5: 20px;
            --space-6: 24px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            font-family: var(--font-sans);
            font-size: 14px;
            color: var(--color-text-primary);
            background-color: var(--color-primary-bg);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        #app {
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        /* 滚动条样式 */
        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--color-primary-lighter);
            border-radius: 2px;
        }

        /* 按钮基础样式 */
        button {
            font-family: inherit;
            cursor: pointer;
            border: none;
            background: none;
            outline: none;
        }

        /* 输入框基础样式 */
        input, textarea, select {
            font-family: inherit;
            font-size: inherit;
            outline: none;
        }

        /* 标语栏 */
        .slogan-bar {
            position: sticky;
            top: 0;
            z-index: 100;
            background-color: var(--color-card-bg);
            padding: var(--space-4) var(--space-5);
            text-align: center;
            border-bottom: 1px solid var(--color-primary-lighter);
        }

        .slogan-bar span {
            font-family: var(--font-sans);
            font-size: 15px;
            font-weight: 500;
            color: var(--color-text-primary);
            letter-spacing: 2px;
        }

        /* 主内容区 */
        .main-content {
            flex: 1;
            overflow-y: auto;
            padding-bottom: 80px;
        }

        .module {
            display: none;
            padding: var(--space-4);
        }

        .module.active {
            display: block;
        }

        /* 底部导航栏 */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 100;
            background-color: var(--color-card-bg);
            display: flex;
            justify-content: space-around;
            padding: var(--space-3) 0;
            padding-bottom: calc(var(--space-3) + env(safe-area-inset-bottom));
            border-top: 1px solid var(--color-primary-lighter);
            box-shadow: 0 -2px 12px rgba(45, 90, 45, 0.06);
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: var(--space-1);
            padding: var(--space-2) var(--space-4);
            color: var(--color-text-muted);
            transition: color 0.2s ease;
        }

        .nav-item.active {
            color: var(--color-primary);
        }

        .nav-icon {
            width: 22px;
            height: 22px;
        }

        .nav-label {
            font-size: 11px;
            font-family: var(--font-serif);
        }
    </style>
</head>
<body>
    <div id="app">
        <!-- 顶部标语栏 -->
        <header id="slogan-bar" class="slogan-bar">
            <span id="slogan-text">一期一会，珍惜当下</span>
        </header>

        <!-- 主内容区 -->
        <main id="main-content" class="main-content">
            <!-- 日程模块 -->
            <section id="schedule-module" class="module active">
                <!-- 日程内容将在后续任务中添加 -->
            </section>

            <!-- 恒例模块 -->
            <section id="routine-module" class="module">
                <!-- 恒例内容将在后续任务中添加 -->
            </section>

            <!-- 月度模块 -->
            <section id="monthly-module" class="module">
                <!-- 月度内容将在后续任务中添加 -->
            </section>
        </main>

        <!-- 底部导航栏 -->
        <nav id="bottom-nav" class="bottom-nav">
            <button class="nav-item active" data-module="schedule">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                    <line x1="16" y1="2" x2="16" y2="6"></line>
                    <line x1="8" y1="2" x2="8" y2="6"></line>
                    <line x1="3" y1="10" x2="21" y2="10"></line>
                </svg>
                <span class="nav-label">日程</span>
            </button>
            <button class="nav-item" data-module="routine">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="9 11 12 14 22 4"></polyline>
                    <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path>
                </svg>
                <span class="nav-label">恒例</span>
            </button>
            <button class="nav-item" data-module="monthly">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                    <line x1="16" y1="2" x2="16" y2="6"></line>
                    <line x1="8" y1="2" x2="8" y2="6"></line>
                    <line x1="3" y1="10" x2="21" y2="10"></line>
                    <path d="M8 14h.01"></path>
                    <path d="M12 14h.01"></path>
                    <path d="M16 14h.01"></path>
                    <path d="M8 18h.01"></path>
                    <path d="M12 18h.01"></path>
                    <path d="M16 18h.01"></path>
                </svg>
                <span class="nav-label">月度</span>
            </button>
        </nav>
    </div>
    <script>
        // 标语库
        const slogans = [
            '一期一会，珍惜当下',
            '日日是好日',
            '知行合一',
            '慢慢来，比较快',
            '但行好事，莫问前程',
            '活在当下',
            '万事皆可期',
            '心之所向，素履以往',
            '不忘初心',
            '且听风吟',
            '月有阴晴圆缺',
            '山高水长',
            '宁静致远',
            '厚积薄发',
            '水滴石穿',
            '千里之行，始于足下',
            '学无止境',
            '自强不息',
            '上善若水',
            '大道至简',
            '观自在',
            '正心诚意',
            '格物致知',
            '慎独',
            '日拱一卒',
            '功不唐捐',
            '玉汝于成',
            '行远自迩',
            '登高自卑',
            '慎终如始'
        ];

        let lastSloganIndex = -1;

        function updateSlogan() {
            let newIndex;
            do {
                newIndex = Math.floor(Math.random() * slogans.length);
            } while (newIndex === lastSloganIndex && slogans.length > 1);

            lastSloganIndex = newIndex;
            document.getElementById('slogan-text').textContent = slogans[newIndex];
        }

        // 模块切换
        document.addEventListener('DOMContentLoaded', function() {
            const navItems = document.querySelectorAll('.nav-item');
            const modules = document.querySelectorAll('.module');

            navItems.forEach(item => {
                item.addEventListener('click', function() {
                    const targetModule = this.dataset.module;

                    // 更新导航栏状态
                    navItems.forEach(nav => nav.classList.remove('active'));
                    this.classList.add('active');

                    // 切换模块显示
                    modules.forEach(module => module.classList.remove('active'));
                    document.getElementById(`${targetModule}-module`).classList.add('active');

                    // 更新标语
                    updateSlogan();
                });
            });
        });
    </script>
</body>
</html>
